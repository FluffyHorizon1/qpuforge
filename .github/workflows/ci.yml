name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            # libomp-dev provides the OpenMP runtime so clang builds with OpenMP,
            # matching the optional find_package(OpenMP) in CMakeLists.txt.
            sudo apt-get install -y clang libomp-dev
          else
            sudo apt-get install -y g++
          fi

      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            export CXX=clang++
          else
            export CXX=g++
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="$CXX"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure --timeout 1200
